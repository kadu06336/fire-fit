<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fire Fit</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: #0f172a; color: #f8fafc; padding-bottom: 76px; }
    header { background: #1e293b; padding: 14px 16px; border-bottom: 1px solid #334155; position: sticky; top: 0; z-index: 10; }
    h1 { margin: 0; font-size: 1.2rem; color: #fb923c; }
    .aviso { font-size: 0.78rem; color: #cbd5e1; margin-top: 4px; }
    main { padding: 14px; max-width: 680px; margin: 0 auto; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    label { display: block; font-size: 0.8rem; color: #94a3b8; margin-bottom: 4px; }
    input, select, button { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #475569; font-size: 0.95rem; }
    input, select { background: #0f172a; color: #f8fafc; margin-bottom: 10px; }
    button { background: #ea580c; color: #fff; border: none; font-weight: 600; cursor: pointer; }
    button:active { opacity: 0.85; }
    .kpi { font-size: 1.2rem; font-weight: 700; color: #fdba74; }
    .sub { font-size: 0.88rem; color: #cbd5e1; margin-top: 6px; line-height: 1.35; }
    .item { padding: 8px 0; border-bottom: 1px solid #334155; font-size: 0.88rem; }
    .item:last-child { border-bottom: none; }
    .aba { display: none; }
    .aba.ativa { display: block; }
    nav { position: fixed; bottom: 0; left: 0; right: 0; background: #1e293b; border-top: 1px solid #334155; display: flex; justify-content: space-around; padding: 6px 4px; }
    nav button { background: transparent; color: #94a3b8; font-size: 0.72rem; padding: 6px 2px; border-radius: 6px; }
    nav button.ativa { background: #334155; color: #fb923c; }
  </style>
</head>
<body>
  <header>
    <h1>Fire Fit</h1>
    <div class="aviso">Apoio educativo no dia a dia — não substitui profissionais de saúde.</div>
  </header>

  <main>
    <section id="aba-painel" class="aba ativa">
      <div class="card">
        <div id="resumo-aluno" style="font-weight:700; font-size:1rem; margin-bottom:8px;">Aluno não cadastrado</div>
        <div class="grid-2">
          <div>
            <label>Peso atual (kg)</label>
            <div class="kpi" id="kpi-peso">--</div>
          </div>
          <div>
            <label>Meta de peso (kg)</label>
            <div class="kpi" id="kpi-meta">--</div>
          </div>
        </div>
        <div class="sub" id="kpi-diff">Diferença para meta: --</div>
        <div class="sub" id="base-instrutor"></div>
      </div>

      <div class="card">
        <label for="p-nome">Nome</label>
        <input id="p-nome" type="text" placeholder="Nome completo" />

        <div class="grid-2">
          <div>
            <label for="p-idade">Idade</label>
            <input id="p-idade" type="number" inputmode="numeric" placeholder="Ex: 32" />
          </div>
          <div>
            <label for="p-altura">Altura (cm)</label>
            <input id="p-altura" type="number" step="0.1" inputmode="decimal" placeholder="Ex: 175" />
          </div>
        </div>

        <div class="grid-2">
          <div>
            <label for="painel-peso">Peso atual (kg)</label>
            <input id="painel-peso" type="number" step="0.1" inputmode="decimal" placeholder="Ex: 82.5" />
          </div>
          <div>
            <label for="painel-meta">Meta de peso (kg)</label>
            <input id="painel-meta" type="number" step="0.1" inputmode="decimal" placeholder="Ex: 75.0" />
          </div>
        </div>

        <label for="p-objetivo">Programa / Objetivo</label>
        <select id="p-objetivo">
          <option value="perda">Perda de peso</option>
          <option value="ganho">Ganho de massa</option>
        </select>

        <button onclick="salvarPerfilCompleto()">Salvar dados e meta</button>
      </div>
    </section>

    <section id="aba-balanca" class="aba">
      <div class="card">
        <label for="bal-peso">Peso (kg)</label>
        <input id="bal-peso" type="number" step="0.1" inputmode="decimal" placeholder="Ex: 82.5" />
        <label for="bal-meta">Meta de peso (kg)</label>
        <input id="bal-meta" type="number" step="0.1" inputmode="decimal" placeholder="Ex: 75.0" />
        <button onclick="registrarBalanca()">Registrar na balança</button>
      </div>
      <div class="card" id="lista-balanca"></div>
    </section>

    <section id="aba-treinos" class="aba">
      <div class="card">
        <label for="tr-desc">Treino</label>
        <input id="tr-desc" type="text" placeholder="Ex: Caminhada leve" />
        <label for="tr-min">Duração (min)</label>
        <input id="tr-min" type="number" inputmode="numeric" placeholder="Ex: 30" />
        <button onclick="registrarTreino()">Salvar treino</button>
      </div>
      <div class="card" id="lista-treinos"></div>
    </section>

    <section id="aba-glicemia" class="aba">
      <div class="card">
        <label for="gl-val">Glicemia (mg/dL)</label>
        <input id="gl-val" type="number" step="1" inputmode="numeric" placeholder="Ex: 98" />
        <label for="gl-mom">Momento</label>
        <input id="gl-mom" type="text" placeholder="Ex: Jejum / Pós-refeição" />
        <button onclick="registrarGlicemia()">Salvar glicemia</button>
      </div>
      <div class="card" id="lista-glicemia"></div>
    </section>

    <section id="aba-prato" class="aba">
      <div class="card">
        <label for="pr-item">Item do prato</label>
        <input id="pr-item" type="text" placeholder="Ex: Frango + arroz" />
        <label for="pr-kcal">Calorias (kcal)</label>
        <input id="pr-kcal" type="number" inputmode="numeric" placeholder="Ex: 320" />
        <button onclick="registrarPrato()">Adicionar ao prato</button>
      </div>
      <div class="card" id="lista-prato"></div>
    </section>

    <section id="aba-alimentos" class="aba">
      <div class="card">
        <label for="al-nome">Alimento</label>
        <input id="al-nome" type="text" placeholder="Ex: Aveia (40g)" />
        <label for="al-kcal">Calorias (kcal)</label>
        <input id="al-kcal" type="number" inputmode="numeric" placeholder="Ex: 150" />
        <button onclick="registrarAlimento()">Salvar alimento</button>
      </div>
      <div class="card" id="lista-alimentos"></div>
    </section>
  </main>

  <nav>
    <button class="ativa" onclick="abrirAba('painel', this)">Painel</button>
    <button onclick="abrirAba('balanca', this)">Balança</button>
    <button onclick="abrirAba('treinos', this)">Treinos</button>
    <button onclick="abrirAba('glicemia', this)">Glicemia</button>
    <button onclick="abrirAba('prato', this)">Prato</button>
    <button onclick="abrirAba('alimentos', this)">Alimentos</button>
  </nav>

  <script>
    function abrirAba(nome, btn) {
      document.querySelectorAll('.aba').forEach(el => el.classList.remove('ativa'));
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('ativa'));
      document.getElementById('aba-' + nome).classList.add('ativa');
      if (btn) btn.classList.add('ativa');
    }

    async function carregarEstado() {
      const res = await fetch('/api/estado');
      const d = await res.json();
      const p = d.perfil || {};

      const partes = [];
      if (p.nome) partes.push(p.nome);
      if (p.idade != null) partes.push(p.idade + ' anos');
      if (p.altura_cm != null) partes.push(p.altura_cm + ' cm');
      document.getElementById('resumo-aluno').textContent = partes.length ? partes.join(' • ') : 'Aluno não cadastrado';

      document.getElementById('kpi-peso').textContent = d.peso_atual != null ? d.peso_atual + ' kg' : '--';
      document.getElementById('kpi-meta').textContent = d.meta_peso != null ? d.meta_peso + ' kg' : '--';
      document.getElementById('kpi-diff').textContent =
        d.diferenca_meta != null ? 'Diferença para meta: ' + d.diferenca_meta + ' kg' : 'Diferença para meta: --';

      const ori = d.orientacao || {};
      document.getElementById('base-instrutor').textContent =
        (ori.foco ? 'Programa: ' + ori.foco + ' — ' : '') +
        (ori.meta_status ? ori.meta_status + ' ' : '') +
        (ori.base_resumo || '');

      document.getElementById('p-nome').value = p.nome || '';
      document.getElementById('p-idade').value = p.idade != null ? p.idade : '';
      document.getElementById('p-altura').value = p.altura_cm != null ? p.altura_cm : '';
      document.getElementById('p-objetivo').value = p.objetivo || 'perda';

      if (d.meta_peso != null) {
        document.getElementById('painel-meta').value = d.meta_peso;
        document.getElementById('bal-meta').value = d.meta_peso;
      }
      if (d.peso_atual != null) {
        document.getElementById('painel-peso').value = d.peso_atual;
        document.getElementById('bal-peso').value = d.peso_atual;
      }

      document.getElementById('lista-balanca').innerHTML =
        (d.balanca || []).map(x => `<div class="item">${x.data} — <b>${x.peso} kg</b> (Meta: ${x.meta} kg)</div>`).join('') || '<div class="item">Sem registros ainda.</div>';
      document.getElementById('lista-treinos').innerHTML =
        (d.treinos || []).map(x => `<div class="item">${x.data} — <b>${x.descricao}</b> (${x.minutos} min)</div>`).join('') || '<div class="item">Sem treinos ainda.</div>';
      document.getElementById('lista-glicemia').innerHTML =
        (d.glicemia || []).map(x => `<div class="item">${x.data} — <b>${x.valor} mg/dL</b> (${x.momento})</div>`).join('') || '<div class="item">Sem medições ainda.</div>';
      document.getElementById('lista-prato').innerHTML =
        (d.prato || []).map(x => `<div class="item">${x.data} — <b>${x.item}</b> (${x.kcal} kcal)</div>`).join('') || '<div class="item">Prato vazio.</div>';
      document.getElementById('lista-alimentos').innerHTML =
        (d.alimentos || []).map(x => `<div class="item"><b>${x.nome}</b> — ${x.kcal} kcal</div>`).join('') || '<div class="item">Sem alimentos cadastrados.</div>';
    }

    async function salvarPerfilCompleto() {
      await fetch('/api/perfil', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          nome: document.getElementById('p-nome').value,
          idade: document.getElementById('p-idade').value,
          altura_cm: document.getElementById('p-altura').value,
          objetivo: document.getElementById('p-objetivo').value,
          peso_atual: document.getElementById('painel-peso').value,
          meta_peso: document.getElementById('painel-meta').value
        })
      });
      carregarEstado();
    }

    async function registrarBalanca() {
      await fetch('/api/balanca', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          peso: document.getElementById('bal-peso').value,
          meta_peso: document.getElementById('bal-meta').value
        })
      });
      carregarEstado();
    }

    async function registrarTreino() {
      await fetch('/api/treinos', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          descricao: document.getElementById('tr-desc').value,
          minutos: document.getElementById('tr-min').value
        })
      });
      carregarEstado();
    }

    async function registrarGlicemia() {
      await fetch('/api/glicemia', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          valor: document.getElementById('gl-val').value,
          momento: document.getElementById('gl-mom').value
        })
      });
      carregarEstado();
    }

    async function registrarPrato() {
      await fetch('/api/prato', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          item: document.getElementById('pr-item').value,
          kcal: document.getElementById('pr-kcal').value
        })
      });
      carregarEstado();
    }

    async function registrarAlimento() {
      await fetch('/api/alimentos', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          nome: document.getElementById('al-nome').value,
          kcal: document.getElementById('al-kcal').value
        })
      });
      carregarEstado();
    }

    carregarEstado();
  </script>
</body>
</html>
