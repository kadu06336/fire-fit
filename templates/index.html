<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fire Fit — Prato e Cardápio</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .wrap {
      max-width: 820px;
      margin: 0 auto;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 18px;
    }
    .topo {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .topo h2 { margin: 0; font-size: 1.2rem; }
    .topo small { color: #94a3b8; }
    .acoes-topo { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .switch-modo {
      display: flex;
      background: #0f172a;
      padding: 4px;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    .switch-modo button {
      border: 0;
      padding: 7px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      background: transparent;
      color: #94a3b8;
    }
    .switch-modo button.ativo {
      background: #f97316;
      color: #ffffff;
    }
    .btn {
      border: 1px solid #475569;
      background: #0f172a;
      color: #f8fafc;
      padding: 7px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
    }
    .btn-laranja {
      background: #f97316;
      border-color: #f97316;
      color: #ffffff;
    }
    .dias {
      display: none;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
    }
    .dias button {
      border: 1px solid #475569;
      background: #0f172a;
      color: #cbd5e1;
      padding: 6px 11px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    .dias button.ativo {
      background: #f97316;
      border-color: #f97316;
      color: #ffffff;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr auto;
      gap: 10px;
      align-items: end;
      margin-bottom: 12px;
    }
    .form-grid.sem-calc {
      grid-template-columns: 2fr 1fr auto;
    }
    label {
      display: block;
      font-size: 0.78rem;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      padding: 9px 10px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #f8fafc;
      font-size: 0.92rem;
    }
    .campo-calc.oculto { display: none; }
    .barra-previa {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 9px 12px;
      margin-bottom: 14px;
      font-size: 0.88rem;
    }
    .barra-previa.oculto { display: none; }
    .lista-itens {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
    }
    .item-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      background: #0f172a;
      border: 1px solid #263349;
      border-radius: 10px;
      padding: 10px 12px;
    }
    .item-info strong { font-size: 0.96rem; }
    .item-info span { color: #94a3b8; font-size: 0.84rem; margin-left: 8px; }
    .item-dir { display: flex; align-items: center; gap: 10px; }
    .item-kcal { font-weight: 700; color: #4ade80; }
    .item-kcal.oculto { display: none; }
    .btn-del {
      border: 0;
      background: #dc2626;
      color: #ffffff;
      border-radius: 6px;
      padding: 4px 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.8rem;
    }
    .rodape-total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      background: #0b1220;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px 14px;
      font-weight: 700;
    }
    .rodape-total .destaque { color: #f97316; font-size: 1.05rem; }
    .rodape-total .calc-resumo.oculto { display: none; }
    @media (max-width: 640px) {
      .form-grid, .form-grid.sem-calc { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topo">
      <div>
        <h2>Prato e Cardápio</h2>
        <small>Monte o prato na hora ou planeje a semana no mesmo lugar</small>
      </div>
      <div class="acoes-topo">
        <div class="switch-modo">
          <button type="button" id="btnModoHoje" class="ativo" onclick="mudarModo('hoje')">Prato do Dia</button>
          <button type="button" id="btnModoSemanal" onclick="mudarModo('semanal')">Cardápio Semanal</button>
        </div>
        <button type="button" class="btn" id="btnToggleCalc" onclick="alternarCalculo()">Remover cálculo</button>
      </div>
    </div>

    <div class="dias" id="barraDias"></div>

    <div class="form-grid" id="formGrid">
      <div>
        <label for="inpAlimento">Alimento</label>
        <input type="text" id="inpAlimento" placeholder="Ex: arroz, feijao, bife" />
      </div>
      <div>
        <label for="inpGramas">Quantidade (g)</label>
        <input type="number" id="inpGramas" min="1" step="any" placeholder="Ex: 150" oninput="atualizarPrevia()" />
      </div>
      <div class="campo-calc" id="boxKcal100">
        <label for="inpKcal100">Kcal por 100g</label>
        <input type="number" id="inpKcal100" min="0.1" step="any" placeholder="Ex: 128" oninput="atualizarPrevia()" />
      </div>
      <button type="button" class="btn btn-laranja" style="padding:10px 14px;" onclick="adicionarItem()">+ Adicionar</button>
    </div>

    <div class="barra-previa" id="barraPrevia">
      <span>Item: <strong id="txtPrevia" style="color:#4ade80;">0 kcal</strong></span>
      <div style="display:flex;gap:8px;">
        <button type="button" class="btn" id="btnPuxarSemanal" style="display:none;" onclick="puxarSemanalParaHoje()">Puxar cardápio de hoje</button>
        <button type="button" class="btn" onclick="limparPrato()">Limpar prato</button>
      </div>
    </div>

    <div class="lista-itens" id="listaItens"></div>

    <div class="rodape-total">
      <div>Total no prato: <span class="destaque" id="totalGramas">0g</span></div>
      <div class="calc-resumo" id="boxTotalKcal">Total calórico: <span class="destaque" id="totalKcal">0 kcal</span></div>
    </div>
  </div>

  <script>
    (function () {
      const STORAGE_KEY = "fire_fit_unificado_completo_v1";
      const DIAS = ["Seg", "Ter", "Qua", "Qui", "Sex", "Sáb", "Dom"];

      function diaAtualIdx() {
        const d = new Date().getDay();
        return d === 0 ? 6 : d - 1;
      }

      function hojeChave() {
        return new Date().toISOString().slice(0, 10);
      }

      function estadoInicial() {
        return {
          modo: "hoje",
          diaIdx: diaAtualIdx(),
          calculoAtivo: true,
          pratosDia: {},
          cardapioSemanal: { 0: [], 1: [], 2: [], 3: [], 4: [], 5: [], 6: [] }
        };
      }

      let estado = estadoInicial();
      try {
        const salvo = localStorage.getItem(STORAGE_KEY);
        if (salvo) {
          const parsed = JSON.parse(salvo);
          estado = Object.assign(estadoInicial(), parsed);
        }
      } catch (e) {}

      function salvar() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(estado));
      }

      function itensAtuais() {
        if (estado.modo === "semanal") {
          if (!estado.cardapioSemanal[estado.diaIdx]) estado.cardapioSemanal[estado.diaIdx] = [];
          return estado.cardapioSemanal[estado.diaIdx];
        }
        const chave = hojeChave();
        if (!estado.pratosDia[chave]) estado.pratosDia[chave] = [];
        return estado.pratosDia[chave];
      }

      function setItensAtuais(lista) {
        if (estado.modo === "semanal") {
          estado.cardapioSemanal[estado.diaIdx] = lista;
        } else {
          estado.pratosDia[hojeChave()] = lista;
        }
        salvar();
      }

      // Regra exata: (kcal a cada 100g / 100) * gramas consumidas
      function calcularKcal(gramas, kcal100) {
        const g = parseFloat(gramas);
        const k = parseFloat(kcal100);
        if (!g || g <= 0 || !k || k <= 0) return 0;
        return Math.round(((k / 100) * g) * 10) / 10;
      }

      window.atualizarPrevia = function () {
        const g = document.getElementById("inpGramas").value;
        const k = document.getElementById("inpKcal100").value;
        document.getElementById("txtPrevia").textContent = calcularKcal(g, k) + " kcal";
      };

      window.adicionarItem = function () {
        const nome = (document.getElementById("inpAlimento").value || "").trim();
        const gramas = parseFloat(document.getElementById("inpGramas").value);
        const kcal100 = parseFloat(document.getElementById("inpKcal100").value);

        if (!nome) {
          alert("Digite o nome do alimento.");
          return;
        }
        if (!gramas || gramas <= 0) {
          alert("Digite a quantidade em gramas.");
          return;
        }
        if (estado.calculoAtivo && (!kcal100 || kcal100 <= 0)) {
          alert("Digite as calorias por 100g.");
          return;
        }

        const lista = itensAtuais();
        lista.push({
          id: Date.now() + Math.random(),
          nome: nome,
          gramas: gramas,
          kcal100: kcal100 || 0
        });
        setItensAtuais(lista);

        document.getElementById("inpAlimento").value = "";
        document.getElementById("inpGramas").value = "";
        document.getElementById("inpKcal100").value = "";
        document.getElementById("txtPrevia").textContent = "0 kcal";
        render();
      };

      window.removerItem = function (id) {
        setItensAtuais(itensAtuais().filter(function (item) { return item.id !== id; }));
        render();
      };

      window.limparPrato = function () {
        setItensAtuais([]);
        render();
      };

      window.mudarModo = function (modo) {
        estado.modo = modo;
        salvar();
        render();
      };

      window.escolherDia = function (idx) {
        estado.diaIdx = idx;
        salvar();
        render();
      };

      window.puxarSemanalParaHoje = function () {
        const base = estado.cardapioSemanal[diaAtualIdx()] || [];
        estado.pratosDia[hojeChave()] = base.map(function (item) {
          return {
            id: Date.now() + Math.random(),
            nome: item.nome,
            gramas: item.gramas,
            kcal100: item.kcal100
          };
        });
        estado.modo = "hoje";
        salvar();
        render();
      };

      window.alternarCalculo = function () {
        estado.calculoAtivo = !estado.calculoAtivo;
        salvar();
        render();
      };

      function render() {
        const isSemanal = estado.modo === "semanal";
        document.getElementById("btnModoHoje").classList.toggle("ativo", !isSemanal);
        document.getElementById("btnModoSemanal").classList.toggle("ativo", isSemanal);

        const barraDias = document.getElementById("barraDias");
        barraDias.style.display = isSemanal ? "flex" : "none";
        barraDias.innerHTML = DIAS.map(function (nomeDia, idx) {
          const cls = idx === estado.diaIdx ? "ativo" : "";
          return '<button type="button" class="' + cls + '" onclick="escolherDia(' + idx + ')">' + nomeDia + '</button>';
        }).join("");

        const calcOn = !!estado.calculoAtivo;
        document.getElementById("btnToggleCalc").textContent = calcOn ? "Remover cálculo" : "Ativar cálculo";
        document.getElementById("formGrid").classList.toggle("sem-calc", !calcOn);
        document.getElementById("boxKcal100").classList.toggle("oculto", !calcOn);
        document.getElementById("barraPrevia").classList.toggle("oculto", !calcOn);
        document.getElementById("boxTotalKcal").classList.toggle("oculto", !calcOn);

        const temSemanalHoje = (estado.cardapioSemanal[diaAtualIdx()] || []).length > 0;
        document.getElementById("btnPuxarSemanal").style.display = (!isSemanal && temSemanalHoje) ? "inline-block" : "none";

        const lista = itensAtuais();
        const container = document.getElementById("listaItens");
        let somaGramas = 0;
        let somaKcal = 0;

        if (!lista.length) {
          container.innerHTML = '<div style="color:#94a3b8;padding:10px 4px;">Nenhum alimento adicionado ainda.</div>';
        } else {
          container.innerHTML = lista.map(function (item) {
            const g = Number(item.gramas) || 0;
            const kcalItem = calcularKcal(g, item.kcal100);
            somaGramas += g;
            somaKcal += kcalItem;

            const detalheCalc = calcOn ? ' · ' + (item.kcal100 || 0) + ' kcal/100g' : '';
            const badgeKcal = '<span class="item-kcal ' + (calcOn ? '' : 'oculto') + '">' + kcalItem + ' kcal</span>';

            return (
              '<div class="item-card">' +
                '<div class="item-info">' +
                  '<strong>' + item.nome + '</strong>' +
                  '<span>' + g + 'g' + detalheCalc + '</span>' +
                '</div>' +
                '<div class="item-dir">' +
                  badgeKcal +
                  '<button type="button" class="btn-del" onclick="removerItem(' + item.id + ')">✕</button>' +
                '</div>' +
              '</div>'
            );
          }).join("");
        }

        document.getElementById("totalGramas").textContent = (Math.round(somaGramas * 10) / 10) + "g";
        document.getElementById("totalKcal").textContent = (Math.round(somaKcal * 10) / 10) + " kcal";
      }

      render();
    })();
  </script>
</body>
</html>
